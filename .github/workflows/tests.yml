name: CI Tests

# Запуск будет происходить при каждом push в ветку main
on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Копирование репозитория
      uses: actions/checkout@v3

    - name: Настройка Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Установка зависимостей
      run: |
        cd ASU_TP_backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Запуск автотестов
      env:
            DATABASE_URL: "sqlite:///./test_db.sqlite"
            SECRET_KEY: "super_secret_test_key"
            ALGORITHM: "HS256"
            ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      run: |
        cd ASU_TP_backend
        pytest

  build-and-push:
      needs: test 
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        
        - name: Log in to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
            
        - name: Build and push Backend
          uses: docker/build-push-action@v4
          with:
            context: ./ASU_TP_backend
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/asu_backend:latest
            
        - name: Build and push Frontend
          uses: docker/build-push-action@v4
          with:
            context: ./ASU_TP_frontend
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/asu_frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 6365
          script: |
            cd /home/ASU_archive
            docker compose pull
            docker compose up -d
            docker image prune -f
