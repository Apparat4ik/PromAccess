version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: PromAccess
      POSTGRES_PASSWORD: Password
      POSTGRES_DB: promaccess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: ./ASU_TP_backend
    restart: always
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/lab4_db
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./ASU_TP_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
